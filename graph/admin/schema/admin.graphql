# Admin API, served only on the loopback admin listener (admin_addr) and used by the
# `journal-server enroll-code | devices | revoke | private` commands. See docs/authentication.md.

scalar Time

type Query {
  "Enrolled devices, oldest first; all users when user is omitted."
  devices(user: String): [Device!]!
}

type Mutation {
  "Creates a one-time enrollment code for a user listed in config.json."
  createEnrollmentCode(user: String!): EnrollmentCode!
  "Revokes an enrolled device's certificate; the server rejects it from then on."
  revokeDevice(serial: String!): Device!
  "Keeps the files the user marked private from a device (withhold), or sends them to it again."
  setWithholdPrivate(serial: String!, withhold: Boolean!): Device!
  """
  journal-server index finished a run: the server reads what it added to the indexes' caches now. False when the
  server reads files itself ("index": "server") and has nothing to read.
  """
  indexesUpdated: Boolean!
}

type EnrollmentCode {
  code: String!
  user: String!
  expiresAt: Time!
  "public_url from config.json, if set."
  serverUrl: String
}

type Device {
  serial: String!
  user: String!
  name: String!
  keyProtection: String!
  registeredAt: Time!
  expiresAt: Time!
  revokedAt: Time
  "The server keeps the files the user marked private from this device."
  withholdPrivate: Boolean!
}
