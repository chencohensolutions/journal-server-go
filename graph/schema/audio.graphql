# --- Sound recordings ---------------------------------------------------------
# Recordings of events, recorded phone calls and WhatsApp voice messages (Media.kind AUDIO), imported by
# scripts/import or uploaded by devices (their length, format, start and caller are read from the file by the server). They have no preview (/media/{sha256}/preview answers 404); the original plays from /media with
# Range. All three are hidden on every device until the user shows them (hiddenCollections.recordings, calls,
# voiceMessages). A recording's start is takenAt and its end endedAt.

extend type ServerInfo {
  "Sound recordings can be in the library (Media.kind AUDIO, Media.call, setCall)."
  audio: Boolean!
  "The server keeps an uploaded WAV as FLAC (ffmpeg is installed); without it, a WAV upload's last piece answers 503."
  encodesWav: Boolean!
  """
  The server keeps JPEG photos as JPEG XL, losslessly (libjxl is loaded): an uploaded JPEG is stored as its JPEG XL,
  a phone's JPEG XL of a JPEG (StartUploadInput.encodedFrom) is checked to make that JPEG byte for byte, and GET
  /media/{a JPEG's sha256} and verify make the JPEG again. Without it JPEGs are kept as they are, and a JPEG kept as
  JPEG XL earlier answers 503 when asked for by the JPEG's sha256.
  """
  keepsJpegAsJxl: Boolean!
}

"""
Who a recorded phone call was with, as the recorder named the file: usually the contact or, without one, the number,
so often only one of the two is known.
"""
type Call {
  contact: String
  "As the recorder wrote it: 0501234567, +972501234567, *3123."
  number: String
}

input CallInput {
  "Empty or left out: none."
  contact: String
  "Empty or left out: none."
  number: String
}

extend type Mutation {
  """
  Corrects who a recorded call was with: both are replaced, and a recording set so becomes a call. Null when the file
  isn't a sound recording this device may see. The file comes again in the change feed.
  """
  setCall(sha256: Sha256!, call: CallInput!): Media
}
