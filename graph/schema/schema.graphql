# --- Authentication -----------------------------------------------------------
# Every root field requires a client certificate unless it is marked @public.
# See docs/authentication.md.
#
# Errors a device acts on carry a code in extensions.code (docs/media.md, "Errors"): UNAUTHORIZED, NO_DATA_FOLDER,
# INVALID_ARGUMENT, SEARCH_OFF, WITHHELD.

scalar Time

"Root field that clients may call without a client certificate."
directive @public on FIELD_DEFINITION

type Query {
  "Which account an enrollment code belongs to. Does not use up the code."
  enrollmentPreview(code: String!): EnrollmentPreviewResult! @public
  "What this server can do, so an app shows only what works."
  serverInfo: ServerInfo!
}

type ServerInfo {
  "The API's version: raised when a change needs newer apps."
  api: Int!
  "A device can renew its certificate (renewCertificate) before it expires."
  renewCertificates: Boolean!
  """
  The CA that signs this server's certificates (its server certificate and the devices'), PEM. Each server has its own
  (journal-server setup makes one), so an app keeps it once enrolled and trusts this server by it from then on,
  whatever address it is reached at, beside the CA built into the app (Nov 14, 2026). Null when the server can't read
  it.
  """
  caCertificate: String
  "The server's version and build: \"1.4.2 (3f2a9c1 2026-10-23)\", or just the version when built without git."
  version: String!
  "Text search (searchMedia) is on."
  search: Boolean!
  "Previews of photos can be made (libvips is installed)."
  previews: Boolean!
  "Posters of videos can be taken (ffmpeg is installed); without it a video's preview answers 503."
  posters: Boolean!
  """
  With posters: a video's preview can be its very first frame (?frame=first), and GET /media/{sha256}/frame gives
  that frame as a one-frame MP4 of the video's own data, for a phone that decodes video thumbnails itself.
  """
  videoFrames: Boolean!
  """
  New files are scanned for nudity (NudeNet's model is installed), so what scores high is hidden soon after it comes
  (hiddenCollections.nudity). Without it nothing is scanned, and nothing is hidden for nudity.
  """
  nudityScan: Boolean!
  "Face search (people, Media.faces, similarFaces) is on."
  faces: Boolean!
  "Text in photos is read (Media.text), and searchMedia finds photos by it."
  textInPhotos: Boolean!
  "Similar photos (similarMedia) and duplicates are on."
  similar: Boolean!
  "Photos get aesthetic scores (Media.aesthetic)."
  aesthetic: Boolean!
  "Files can be tucked away (setTucked, Media.tucked)."
  tuckedAway: Boolean!
  "Notes are kept and synced (setNote, Media.note)."
  notes: Boolean!
  "enrollDevice takes the app enrolling (EnrollDeviceInput.app), and devices of audio-logs see sound recordings."
  deviceApps: Boolean!
  "An enrolled app can get a sibling code for another app on its phone (siblingEnrollmentCode): one enrollment per phone."
  siblingCodes: Boolean!
  "An app made for sound recordings chooses whether it shows calls and voice messages (setSoundRecordingsShown)."
  soundRecordingsShown: Boolean!
  """
  Each app keeps its own note on a file (Media.note and setNote are the asking app's own; journal's is the one from
  before) and its own data (appData, setAppData), so one app never sees another's.
  """
  appNotes: Boolean!
  "The sound recordings can be read a page at a time, newest first (recordingsPage)."
  recordingsPage: Boolean!
}

type Mutation {
  "Trades a one-time enrollment code and a certificate request for a client certificate."
  enrollDevice(input: EnrollDeviceInput!): EnrollDeviceResult! @public
  """
  Renews the calling device's certificate (serverInfo.renewCertificates): a new certificate for a new key, for the same
  user and device, with its settings. The old certificate works until the new one is first used, and is then
  revoked. A device renews in the last 30 days of its certificate (expiresAt). NOT_ENROLLED for a certificate made
  outside enrollment, or revoked; RATE_LIMITED more than 60 days before it expires, or after 5 renewals of the same
  certificate.
  """
  renewCertificate(csr: String!, keyProtection: KeyProtection!): EnrollDeviceResult!
  """
  A one-time code for another app on the calling device's phone, so the user enrolls a phone once for all its apps.
  The app already enrolled asks for it when the user confirms there, and hands it to the other app on the phone, which
  enrolls with it (enrollDevice, with that app's name) within 2 minutes. Each app keeps its own key (Android ties a key
  to the app that made it), but the server keeps them as one phone: one name, revoked and kept from private files
  together. NOT_ENROLLED for a certificate made outside enrollment, or revoked; RATE_LIMITED after 10 codes for a phone
  in an hour.
  """
  siblingEnrollmentCode(app: String!): SiblingCodeResult!
}

union SiblingCodeResult = SiblingCode | EnrollmentRejected

type SiblingCode {
  "Redeemed by enrollDevice like a code from journal-server enroll-code, only by the app it names."
  code: String!
  app: String!
  expiresAt: Time!
}

input EnrollDeviceInput {
  "As shown by `journal-server enroll-code`; case, dashes and spaces are ignored."
  code: String!
  "Shown in `journal-server devices` so the device can be told apart and revoked."
  deviceName: String!
  "PKCS#10 certificate request for an EC P-256 key, base64-encoded DER."
  csr: String!
  keyProtection: KeyProtection!
  """
  The app enrolling, in lower case: journal (the default when null) or audio-logs (Audio Logs, which records and
  transcribes). Two apps on one phone enroll as two devices, each with its own key. A device of audio-logs sees the
  user's sound recordings whatever the user hides (hiddenCollections.recordings, calls, voiceMessages): it uploads
  them and plays them back. Servers before Nov 16, 2026 (serverInfo.deviceApps false) refuse this field.
  """
  app: String
}

"Where the device keeps its private key."
enum KeyProtection {
  "Android StrongBox security chip"
  STRONGBOX
  "Android Keystore in the trusted execution environment"
  TEE
  "Apple Secure Enclave"
  SECURE_ENCLAVE
  "Ordinary software key (emulators and simulators)"
  SOFTWARE
}

union EnrollmentPreviewResult = EnrollmentPreview | EnrollmentRejected

type EnrollmentPreview {
  user: String!
  expiresAt: Time!
}

union EnrollDeviceResult = EnrolledDevice | EnrollmentRejected

type EnrolledDevice {
  user: String!
  deviceName: String!
  "Issued client certificate, base64-encoded DER."
  certificate: String!
  serial: String!
  expiresAt: Time!
}

type EnrollmentRejected {
  reason: EnrollmentRejectedReason!
}

enum EnrollmentRejectedReason {
  "Wrong, expired or already used code."
  INVALID_CODE
  "The certificate request is malformed, badly signed or not for an EC P-256 key."
  INVALID_CSR
  "Too many wrong codes from this address; wait a minute."
  RATE_LIMITED
  "renewCertificate: the certificate wasn't issued by enrollment, or is revoked; enroll again."
  NOT_ENROLLED
  "enrollDevice with a sibling code made for another app (SiblingCode.app)."
  WRONG_APP
}
