# --- Media --------------------------------------------------------------------
# Originals in the user's data folder, identified by the sha256 of their content.
# The bytes travel over plain HTTP (PUT /upload/{sha256}, GET /media/{sha256}); see docs/media.md.

"The file a sound recording was encoded from, which isn't kept: a WAV kept as FLAC."
type EncodedFrom {
  sha256: Sha256!
  mimeType: String!
  size: Int64!
}

"64 lowercase hex characters: the sha256 of a file's content."
scalar Sha256
scalar Int64

enum MediaKind {
  PHOTO
  VIDEO
  "A sound recording: of an event, a phone call (call) or a WhatsApp voice message (source folder:WhatsApp)."
  AUDIO
}

type GeoPoint {
  lat: Float!
  lon: Float!
}

input GeoPointInput {
  lat: Float!
  lon: Float!
}

type Media {
  sha256: Sha256!
  kind: MediaKind!
  "The name the file had on the device."
  fileName: String!
  mimeType: String!
  size: Int64!
  "When it was taken, with the offset of the place it was taken; for a video or recording, when it started."
  takenAt: Time
  "When a video or recording ended: takenAt plus durationMs."
  endedAt: Time
  width: Int
  height: Int
  durationMs: Int64
  location: GeoPoint
  """
  What the file is and where it came from, as the server's one rule decides it (docs/media.md, "Sources"): camera,
  screenshots, received (photos from a camera the user marked not theirs, shown as "Sent to you"), other, or a folder
  kind, "folder:" and the folder's name (folder:WhatsApp, folder:Telegram, folder:Petcube). Compared ignoring case.
  Before Oct 27, 2026 WhatsApp was whatsapp, which apps read as folder:WhatsApp.
  """
  source: String
  "The app on screen in a screenshot, as its file name says (Screenshot_20240301_030715_Bumble.jpg: Bumble)."
  screenshotApp: String
  "The same as screenshotApp."
  app: String @deprecated(reason: "Use screenshotApp: it is the app on screen in a screenshot, not the app that saved the file.")
  "The camera that took it, as its tags say (EXIF for a photo, the container's tags for a video); null without tags."
  camera: Camera
  "The photo this one is an edit of."
  versionOf: Sha256
  "Edits of this photo, oldest first."
  versions: [Sha256!]!
  "The file this one belongs with: a Live Photo's video names its photo, a RAW its JPEG."
  pairedWith: Sha256
  "Files that name this one in pairedWith."
  paired: [Sha256!]!
  uploadedAt: Time!
  "The device that uploaded it."
  uploadedBy: String!
  """
  How sure the nudity scan is that it shows nudity, 0 to 1; null until scanned. What scores at the user's
  hiddenCollections.nudity.from or more never reaches devices while that is on.
  """
  nudity: Float
  """
  The user marked it private (setPrivate). Clients hide it while "Show private media" is off, and fetch nothing of
  it. Devices the server keeps from private files never get it at all.
  """
  private: Boolean!
  "Who a recorded phone call was with; null for anything but a call."
  call: Call
  "The WAV this FLAC was made from (on a device, by the server or by the import); asking for its sha256 finds this file."
  encodedFrom: EncodedFrom
  "The original: /media/{sha256}, with Range support."
  url: String!
}

"What the user's originals take up on the server (sidecars and previews not counted)."
type StorageUsage {
  photos: Int!
  videos: Int!
  "Sound recordings."
  audio: Int!
  photoBytes: Int64!
  videoBytes: Int64!
  audioBytes: Int64!
  "photoBytes + videoBytes + audioBytes."
  bytes: Int64!
}

extend type Query {
  "Which of these hashes the server does not have yet, in the order given. At most 1000 per call."
  missingMedia(hashes: [Sha256!]!): [Sha256!]!
  media(sha256: Sha256!): Media
  storageUsage: StorageUsage!
}

input StartUploadInput {
  sha256: Sha256!
  size: Int64!
  fileName: String!
  mimeType: String!
  kind: MediaKind!
  takenAt: Time
  width: Int
  height: Int
  durationMs: Int64
  location: GeoPointInput
  source: String
  """
  Where the file was on the device, as the device names it: Android's folder in shared storage
  ("Pictures/Telegram/"), an iPhone's album ("WhatsApp"). Kept in the sidecar as it was sent (deviceFolder), so the
  server can tell the source again later; at most 500 characters.
  """
  folder: String
  "Set when this file is an edit of a photo already on the server."
  versionOf: Sha256
  "Set for a Live Photo's video (the photo) or a RAW (its JPEG); that file must be uploaded first."
  pairedWith: Sha256
  """
  A sound recording that is a phone call (from a folder of calls), with who it was with when the device knows; an
  empty one is a call with no one named. The server also reads it from the file name (Samsung's call recorder).
  """
  call: CallInput
  """
  The WAV this FLAC was made from on the device. A WAV is never kept: it is answered as its FLAC (missingMedia,
  startUpload, media, verify), so neither is sent again. A WAV uploaded as it is, the server keeps as FLAC.
  """
  encodedFrom: EncodedFromInput
}

input EncodedFromInput {
  sha256: Sha256!
  mimeType: String!
  size: Int64!
}

union StartUploadResult = UploadReady | MediaExists | UploadRejected

type UploadReady {
  "Where to PUT the pieces: /upload/{sha256}."
  url: String!
  "Bytes already received from an earlier try; send from here."
  offset: Int64!
  "Send pieces of this size (the last one may be smaller)."
  chunkSize: Int64!
  "Unfinished uploads are deleted after this; startUpload again extends it."
  expiresAt: Time!
}

"The server already has this file (from this device or another); nothing to send."
type MediaExists {
  media: Media!
}

type UploadRejected {
  reason: UploadRejectedReason!
}

enum UploadRejectedReason {
  "versionOf names a photo the server doesn't have."
  UNKNOWN_ORIGINAL
  "pairedWith names a file the server doesn't have; upload that one first."
  UNKNOWN_PAIR
  TOO_LARGE
  "Not enough free disk space on the server."
  NO_SPACE
}

extend type Mutation {
  "Declares a file before its bytes are sent, or continues an upload that stopped."
  startUpload(input: StartUploadInput!): StartUploadResult!
  """
  Marks files private, or no longer private, with every file that goes with them (edits, Live Photo videos, RAWs).
  Returns the files that changed; they come again in the change feed. At most 1000 hashes per call. A device the
  server keeps from private files may mark files private but not unmark them, and gets back none of them.
  """
  setPrivate(sha256s: [Sha256!]!, private: Boolean!): [Media!]!
}

# --- Change feed --------------------------------------------------------------
# A device keeps the cursor of the last page it applied and asks for what changed since. Only media so far;
# stories and notes will come as FILE changes. A cursor is never wrong to send: one the server can't read starts
# the feed again.

enum ChangeKind {
  MEDIA
}

type Change {
  kind: ChangeKind!
  "media/<sha256> for media."
  path: String!
  "Gone from the server, a private file the server keeps from this device, or hidden (see hidden)."
  deleted: Boolean!
  """
  Deleted because the user hides it on every device (hiddenCollections: a hidden collection or nudity). The file is
  still on the server: a device leaves out its own copy too (the photo with this sha256), and never uploads it again.
  """
  hidden: Boolean!
  "The new state; null when deleted."
  media: Media
}

type ChangePage {
  changes: [Change!]!
  "Pass to the next call. Store it only after applying this page."
  cursor: String!
  hasMore: Boolean!
  "How many changes come after this page, so a device can show its progress through a long feed."
  remaining: Int!
}

extend type Query {
  "What changed since the cursor; without one, everything (a new device). At most 5000 per page."
  changes(since: String, limit: Int = 2000): ChangePage!
}
