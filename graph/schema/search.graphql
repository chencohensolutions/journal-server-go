# --- Text search ----------------------------------------------------------------
# Photos and videos found by a description in words, with a SigLIP 2 model on the server; see docs/search.md.

type SearchHit {
  media: Media!
  """
  How close the file is to the text: the cosine similarity of their vectors, -1 to 1. Only the order means much;
  a good match is often 0.1 to 0.2.
  """
  score: Float!
  """
  Hits with the same set are almost identical photos (a burst, a pose taken again): very alike and taken within ten
  minutes of the set's best. Numbered from 0 in the order of each set's best hit, counting from the first hit (not the
  offset), so a page continues the numbers of the pages before it. Apps show a set as one photo you swipe.
  """
  set: Int!
  """
  Sets taken within two hours of each other share a moment. Numbered from 0 in the order of each moment's best hit,
  counting from the first hit, as set is.
  Apps keep a moment's sets together.
  """
  moment: Int!
}

type MediaSearch {
  "Best first."
  hits: [SearchHit!]!
  "How many of the user's files the server has read so far; the others can't be found yet."
  indexed: Int!
  "How many files the user has."
  total: Int!
  "The model that searched, e.g. siglip2-base-patch16-256."
  model: String!
}

"""
A box on the map, in degrees. When east is less than west the box crosses the 180° meridian.
"""
input GeoAreaInput {
  south: Float!
  west: Float!
  north: Float!
  east: Float!
}

extend type Query {
  """
  The photos and videos that text describes best ("a dog on the beach at sunset"), best first: limit of them (at most
  1000) after the first offset, for the next page; offset + limit at most 10000.
  With years, only files taken in one of them (the year where they were taken; when that isn't known, the year
  uploaded). With area, only files taken inside it; files without a location are left out. Both are applied before
  the best are picked, so a filtered search returns the best matches of that year or place. Files the user marked
  private (setPrivate) are left out too, unless includePrivate is true (an app showing private media); on a device
  set to withhold them they are never found. Fails when text search is off on the server.
  """
  searchMedia(text: String!, limit: Int = 100, offset: Int = 0, years: [Int!], area: GeoAreaInput, includePrivate: Boolean = false): MediaSearch!
}
