# --- Hidden collections -------------------------------------------------------
# What the user hides on every device (Settings → Private media → Hidden collections in the apps), the files the
# nudity scan scored high, and sound recordings (hidden until the user shows them). The server does the hiding: a hidden file comes in the change feed as deleted and hidden
# (so a device leaves out its own copy too), isn't counted in storageUsage, isn't found by
# searchMedia, and /media and its preview answer 404. Nothing is deleted; showing a collection again brings its files
# back. missingMedia, startUpload, uploads and verify still see hidden files, so they are never uploaded again.

"Groups of files the user can hide on every device."
type HiddenCollections {
  "Every file WhatsApp saved (source folder:whatsapp): the WhatsApp entry of apps, for apps from before apps."
  whatsapp: Collection! @deprecated(reason: "Use apps: WhatsApp is one of them.")
  """
  The files of each app and folder they came from (every folder kind: source folder:whatsapp, folder:telegram,
  folder:petcube, …), named as folderNames names them (WhatsApp, Telegram, Petcube), most files first. Hiding one hides all its files;
  screenshots are not among them (their source is screenshots: see screenshotApps). A hidden one with no files left is
  listed too, so it can be shown again.
  """
  apps: [Collection!]!
  "Screenshots whose file name says no app (Screenshot_2015-07-18-03-54-57.png). Its name is empty."
  screenshotsWithoutApp: Collection!
  """
  The screenshots of each app their file names name (Media.screenshotApp), most files first. A hidden app with no files left is
  listed too, so it can be shown again.
  """
  screenshotApps: [Collection!]!
  "The files the nudity scan scored high."
  nudity: NudityHiding!
  "Sound recordings that are neither calls nor voice messages (source recording, or any other). Hidden until the user shows them."
  recordings: Collection!
  "Recorded phone calls (source call, or Media.call). Hidden until the user shows them."
  calls: Collection!
  "WhatsApp voice messages and audio (sound recordings with source folder:whatsapp). Hidden until the user shows them."
  voiceMessages: Collection!
  """
  Every file sent to the user (source received: photos from a camera they marked not theirs, see cameras). Its
  name is "Sent to you".
  """
  sentToYou: Collection!
}

"""
Files the nudity scan scored at `from` or more (Media.nudity), hidden on every device while `hidden`. Hidden from 0.5
until the user chooses.
"""
type NudityHiding {
  hidden: Boolean!
  "The score from which files are hidden, 0 to 1 (more than 0); the default 0.5 while not hidden."
  from: Float!
  "How many files the scan scored at `from` or more."
  files: Int!
  "How many files the scan hasn't read yet; they aren't hidden for nudity until it has."
  notScanned: Int!
}

"One group of files: how many it has, hidden or not, and whether it is hidden."
type Collection {
  name: String!
  files: Int!
  "Of files, how many the import placed (uploadedBy import); the rest came from devices."
  imported: Int!
  hidden: Boolean!
}

"The whole choice of what to hide: what isn't listed is shown."
input HiddenCollectionsInput {
  """
  The apps and folders whose files are hidden, by name (WhatsApp, Telegram, as apps names them; a kind such as
  folder:telegram is taken too), compared ignoring case. Left out, they stay as they are.
  """
  apps: [String!]
  "Hides WhatsApp, or shows it, whatever apps say; left out, apps decide. For apps from before apps."
  whatsapp: Boolean
  screenshotsWithoutApp: Boolean!
  "Apps whose screenshots are hidden, compared ignoring case."
  screenshotApps: [String!]!
  "Hiding nudity; left out, it stays as it is."
  nudity: NudityHidingInput
  "Hides the files sent to the user (sentToYou), or shows them; left out, it stays as it is."
  sentToYou: Boolean
  "Hiding sound recordings; left out, it stays as it is."
  audio: AudioHidingInput
}

input AudioHidingInput {
  recordings: Boolean!
  calls: Boolean!
  voiceMessages: Boolean!
}

input NudityHidingInput {
  hidden: Boolean!
  "The score from which files are hidden: more than 0, at most 1. Ignored while not hidden."
  from: Float!
}

extend type Query {
  hiddenCollections: HiddenCollections!
}

extend type Mutation {
  """
  Replaces what the user hides on every device. Devices drop the files now hidden, and get back the ones shown again,
  at their next sync.
  """
  setHiddenCollections(input: HiddenCollectionsInput!): HiddenCollections!
}
