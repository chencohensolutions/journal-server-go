# Publishes a release (docs/install.md, "Releases"): journal-server for Windows, Linux and macOS, the Windows
# installer, and SHA256SUMS signed with the release key, which servers check before they update themselves.
#
# It runs by itself when a push to main changes version/VERSION (the pre-commit hook sets it to the day's date on every
# commit that changes Go code), and releases that version as tag v<version>; a version already released is skipped.
# It can also be started from the Actions tab ("Run workflow") or by pushing the tag. Needs the repository secret
# RELEASE_SIGNING_KEY (go run ./scripts/sign-release new-key <file>).
name: Release

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: [version/VERSION]
  workflow_dispatch:

# One release at a time: two merges in a row release in order.
concurrency: release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Version
        id: version
        run: |
          version="$(tr -d ' \r\n' < version/VERSION)"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version/VERSION ($version)" >&2
            exit 1
          fi
          if gh release view "v$version" >/dev/null 2>&1; then
            if [ "$GITHUB_REF_TYPE" = branch ] && [ "$GITHUB_EVENT_NAME" = push ]; then
              echo "Release v$version exists already: nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Release v$version exists already: raise version/VERSION first (scripts/bump-version.sh)" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Test
        if: steps.version.outputs.skip != 'true'
        run: go test ./...

      - name: Build
        if: steps.version.outputs.skip != 'true'
        run: |
          mkdir -p dist
          for target in windows/amd64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}" arch="${target#*/}"
            out="dist/journal-server-$os-$arch"
            [ "$os" = windows ] && out="$out.exe"
            echo "Building $out"
            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X github.com/journal/server-go/version.Build=release" -o "$out" .
          done

      - uses: actions/upload-artifact@v4
        if: steps.version.outputs.skip != 'true'
        with:
          name: programs
          path: dist/

  # The installer is made on Windows, with Inno Setup itself: under Wine in Docker on Linux it stopped working on
  # GitHub's runners (wineserver: "socket: Function not implemented", every release from Nov 14, 2026).
  installer:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: dist/

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # ONNX Runtime, libvips and ffmpeg go inside the installer: the Microsoft Store takes only installers that work
      # offline (docs/install.md, "Microsoft Store"). Setup still downloads the models.
      - name: Libraries
        shell: pwsh
        run: |
          go run ./scripts/bundle-libraries --out dist\installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          New-Item -ItemType Directory -Force dist\installer | Out-Null
          Copy-Item dist\journal-server-windows-amd64.exe dist\installer\journal-server.exe
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ needs.build.outputs.version }}" "/DDist=..\dist\installer" installer\journal-server.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/journal-server-setup-*.exe

  publish:
    needs: [build, installer]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Sign
        run: |
          cd dist
          { echo "# journal-server ${{ needs.build.outputs.version }}"; sha256sum -- *; } > SHA256SUMS
          cd ..
          go run ./scripts/sign-release sign dist/SHA256SUMS
          go run ./scripts/sign-release verify dist/SHA256SUMS
          cat dist/SHA256SUMS
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      - name: Publish
        run: |
          gh release create "v${{ needs.build.outputs.version }}" dist/* \
            --target "$GITHUB_SHA" --title "journal-server ${{ needs.build.outputs.version }}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
